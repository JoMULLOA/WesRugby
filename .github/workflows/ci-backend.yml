name: Backend CI

on:
  push:
    branches: [ main, mainProduccion ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, mainProduccion ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Tests + Lint (Node 20)
    runs-on: ubuntu-latest

    # ─── Service Container PostgreSQL 16 Alpine ───────────────────────────────
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wesrugby_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: 📦 Instalar dependencias
      working-directory: ./backend
      run: npm ci

    - name: 🔍 Lint (ESLint)
      working-directory: ./backend
      run: npm run lint --if-present
      continue-on-error: true  # El lint no bloquea el pipeline

    - name: 🧪 Ejecutar tests unitarios
      working-directory: ./backend
      run: npm test
      env:
        # ── Entorno general ────────────────────────────────────────────────
        IS_DOCKER: "false"
        NODE_ENV: test
        HOST: 0.0.0.0
        PORT: 3000
        # ── Conexión a PostgreSQL del Service Container ────────────────────
        # TypeORM usará estas variables para conectar y sincronizar el schema
        # (synchronize: true en configDb.js crea las tablas automáticamente)
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: postgres
        PASSWORD: postgres
        DATABASE: wesrugby_test
        # ── Seguridad (claves dummy para CI) ───────────────────────────────
        ACCESS_TOKEN_SECRET: ci_secret_key_solo_para_tests_no_usar_en_prod
        COOKIE_KEY: ci_cookie_key_solo_para_tests
        # ── Email (no se envían correos reales en tests) ───────────────────
        EMAIL_HOST: localhost
        EMAIL_PORT: 587
        EMAIL_USER: test@test.com
        EMAIL_PASS: test_pass

    - name: 📊 Cobertura de código
      working-directory: ./backend
      run: npm run test:coverage
      env:
        IS_DOCKER: "false"
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: postgres
        PASSWORD: postgres
        DATABASE: wesrugby_test
        ACCESS_TOKEN_SECRET: ci_secret_key_solo_para_tests_no_usar_en_prod
        COOKIE_KEY: ci_cookie_key_solo_para_tests
        EMAIL_HOST: localhost
        EMAIL_PORT: 587
        EMAIL_USER: test@test.com
        EMAIL_PASS: test_pass

    - name: 📤 Publicar resumen de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage/
        retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # ELIMINADO para GitHub Free (2000 min/mes):
  #   ❌ matrix node-version [18.x, 20.x]  → duplicaba minutos
  #   ❌ job lint separado                  → incluido en el job 'test'
  #   ❌ job security (trufflehog)          → consume ~3 min extra
  #   ❌ codecov upload                     → requiere cuenta externa
  #
  # Costo estimado por push a main: ~2-3 minutos
  # ──────────────────────────────────────────────────────────────────────
