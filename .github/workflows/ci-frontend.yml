name: Frontend CI (Flutter)

on:
  push:
    branches: [ main, mainProduccion ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, mainProduccion ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Analyze + Tests (Flutter stable)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    # Flutter stable sin pinning de versión
    # (obtiene automáticamente Dart 3.7+ que requiere el pubspec: sdk: ^3.7.2)
    - name: 📱 Configurar Flutter (stable latest)
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 📦 Obtener dependencias
      working-directory: ./frontend
      run: flutter pub get

    - name: 🔍 Analizar código (flutter analyze)
      working-directory: ./frontend
      run: flutter analyze
      continue-on-error: true  # warnings no bloquean el pipeline

    - name: 🧪 Ejecutar tests unitarios
      working-directory: ./frontend
      run: flutter test --coverage

    - name: 📤 Guardar reporte de cobertura como artefacto
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage/
        retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # ELIMINADO para GitHub Free (2000 min/mes):
  #   ❌ job analyze separado    → incluido en 'test' (ahorra ~3 min por push)
  #   ❌ build-android (debug)   → consume ~10-15 min por push
  #   ❌ build-android (release) → consume ~10-15 min por push
  #   ❌ flutter-version: 3.24.0 → incompatible con Dart sdk: ^3.7.2
  #   ❌ codecov upload          → requiere cuenta externa
  #
  # Costo estimado por push a main: ~3-4 minutos
  # ──────────────────────────────────────────────────────────────────
