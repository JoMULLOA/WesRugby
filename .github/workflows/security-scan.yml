name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Escaneo semanal los lunes a las 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: 🔒 Audit de dependencias del backend
      working-directory: ./backend
      run: |
        npm audit --audit-level=moderate --json > audit-report.json || true
        cat audit-report.json
    
    - name: 📤 Subir reporte de audit
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-report
        path: backend/audit-report.json
        retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔍 TruffleHog - Buscar secretos
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🔧 Inicializar CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
    
    - name: 🔨 Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: 🔍 Análisis de CodeQL
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  docker-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐳 Build imagen Docker
      run: |
        docker build -t wesrugby-backend:test ./backend
    
    - name: 🔍 Escanear imagen con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'wesrugby-backend:test'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    
    - name: 🔒 Escanear con Snyk (opcional)
      uses: snyk/actions/docker@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: wesrugby-backend:test
        args: --severity-threshold=high

  sast:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🔍 Semgrep - SAST
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/nodejs
        generateSarif: true
    
    - name: 📤 Subir resultados SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep.sarif

  summary:
    runs-on: ubuntu-latest
    needs: [dependency-check, secret-scan, codeql, docker-security]
    if: always()
    
    steps:
    - name: 📊 Generar resumen de seguridad
      run: |
        echo "## 🔒 Resumen de Escaneo de Seguridad" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Dependency Check:** ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Secret Scan:** ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **CodeQL:** ${{ needs.codeql.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Security:** ${{ needs.docker-security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕒 Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
